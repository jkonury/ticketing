springdoc:
  api-docs:
    enabled: false
  paths-to-match: /api/v1/**
  paths-to-exclude: /api/v1/streams/**
  override-with-generic-response: false

spring:
  reactor:
    context-propagation: auto
  application:
    name: realtime
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 16379

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        queue.admission.batch: true
        queue.admission.scheduler.interval: true
        queue.presence.update: true
  # starter-opentelemetry가 끌어오는 OTLP 지표 푸시는 쓰지 않는다 (지표는 Prometheus가 수집)
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      # Tempo 없이 개발할 때 내보내기 실패 로그가 쌓이지 않도록 기본은 끈다
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:14318/v1/traces}

server:
  port: 18081

---
spring:
  config:
    activate:
      on-profile: local

springdoc:
  api-docs:
    enabled: true
