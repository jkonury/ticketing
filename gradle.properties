# Gradle 빌드 성능 설정. 비밀 값은 넣지 않는다(저장소에 커밋되는 파일이다).

# 작업 출력을 재사용한다. 입력이 같으면 compile·test 결과를 다시 만들지 않는다.
org.gradle.caching=true

# configuration 단계 결과를 저장해 두고 재사용한다. 구성 단계가 build.gradle.kts 평가를 건너뛴다.
org.gradle.configuration-cache=true
# 호환되지 않는 plugin·task가 있으면 경고로 넘기지 않고 빌드를 실패시켜 바로 고치게 한다.
org.gradle.configuration-cache.problems=fail

# 독립된 project의 작업을 병렬로 실행한다(MSA 단계에서 services/* 가 늘어나면 효과가 커진다).
# org.gradle.parallel=true

# Gradle daemon과 Kotlin daemon 메모리.
# org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# kotlin.daemon.jvmargs=-Xmx2g

kotlin.compiler.execution.strategy=in-process
