spring:
  reactor:
    context-propagation: auto
  application:
    name: gateway
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 16379
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          httpclient:
            pool:
              metrics: true
              # 동시 요청마다 코어로 새 연결을 열어 코어 accept 큐(100)가 넘치지 않도록 상한을 두고, 초과분은 Gateway에서 대기시킨다(대기 수는 SCG가 무제한으로 설정)
              type: fixed
              max-connections: ${GATEWAY_POOL_MAX_CONNECTIONS:100}
              acquire-timeout: ${GATEWAY_POOL_ACQUIRE_TIMEOUT_MS:45000}
              # 코어 Tomcat의 keep-alive 만료(약 60초)보다 먼저 풀에서 버려 닫힌 연결 재사용(PrematureCloseException)을 막는다
              max-idle-time: 20s
          globalcors:
            cors-configurations:
              '[/api/v1/streams/**]':
                allowed-origins: ${ticketing.gateway.cors.allowed-origins}
                allowed-methods: GET

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true
        ticketing.gateway.stage: true
        reactor.netty.connection.provider.pending.connections.time: true
  # starter-opentelemetry가 끌어오는 OTLP 지표 푸시는 쓰지 않는다 (지표는 Prometheus가 수집)
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      # Tempo 없이 개발할 때 내보내기 실패 로그가 쌓이지 않도록 기본은 끈다
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:14318/v1/traces}

server:
  port: 18000

ticketing:
  startup-warmup:
    enabled: ${STARTUP_WARMUP_ENABLED:false}
    max-duration: ${STARTUP_WARMUP_MAX_DURATION:120s}
    local-iterations: ${STARTUP_WARMUP_LOCAL_ITERATIONS:10000}
    rounds: ${STARTUP_WARMUP_ROUNDS:15}
    batch-size: ${STARTUP_WARMUP_BATCH_SIZE:1000}
    concurrency: ${STARTUP_WARMUP_CONCURRENCY:1000}
  jwt:
    secret: ${TICKETING_JWT_SECRET}
  gateway:
    cors:
      allowed-origins: http://localhost:13000
    core-uri: ${CORE_URI:http://localhost:18080}
    realtime-uri: ${REALTIME_URI:http://localhost:18081}
