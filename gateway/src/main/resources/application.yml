spring:
  application:
    name: gateway
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/api/v1/streams/**]':
                allowed-origins: ${ticketing.gateway.cors.allowed-origins}
                allowed-methods: GET

server:
  port: 8000

ticketing:
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    cors:
      allowed-origins: http://localhost:3000
    core-uri: ${CORE_URI:http://localhost:8080}
    realtime-uri: ${REALTIME_URI:http://localhost:8081}
