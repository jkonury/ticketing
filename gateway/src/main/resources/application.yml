spring:
  application:
    name: gateway
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  port: 8000

ticketing:
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    core-uri: ${CORE_URI:http://localhost:8080}
    realtime-uri: ${REALTIME_URI:http://localhost:8081}
