springdoc:
  api-docs:
    enabled: false
  paths-to-match: /api/v1/**
  override-with-generic-response: false

spring:
  application:
    name: settlement
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${TICKETING_POSTGRES_PORT:15432}/${TICKETING_SETTLEMENT_POSTGRES_DB:settlement_db}
    username: ${TICKETING_SETTLEMENT_POSTGRES_USER:settlement}
    password: ${TICKETING_SETTLEMENT_POSTGRES_PASSWORD}
    hikari:
      schema: public
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${TICKETING_KAFKA_PORT:19092}
    producer:
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      concurrency: 3
      ack-mode: record
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
      table-prefix: batch.BATCH_

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:14318/v1/traces}

server:
  port: 18086

ticketing:
  jwt:
    secret: ${TICKETING_JWT_SECRET}

logging:
  level:
    org.jooq.Constants: off

---
spring:
  config:
    activate:
      on-profile: local

springdoc:
  api-docs:
    enabled: true
