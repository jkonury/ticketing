spring:
  application:
    name: payment-batch
  main:
    web-application-type: none
  kafka:
    listener:
      # 배치 JVM은 이벤트를 발행만 한다. 소비는 payment가 맡고, 짧게 뜨는 배치가 컨슈머 그룹에 끼어 리밸런스를 일으키지 않게 한다
      auto-startup: false
  batch:
    job:
      enabled: true
  modulith:
    events:
      republish-outstanding-events-on-restart: false
ticketing:
  batch:
    metrics:
      jobs: []
  event-publication:
    metrics:
      # payment가 같은 DB의 지표를 이미 수집한다
      enabled: false
