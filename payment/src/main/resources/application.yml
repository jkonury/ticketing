spring:
  application:
    name: payment
  config:
    # 로컬 비밀 값은 저장소 루트의 .env에서 읽는다 (bootRun은 payment/가 작업 디렉터리, jar는 루트에서 실행)
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  task:
    execution:
      # @ApplicationModuleListener(비동기)로 넘어간 처리도 같은 trace에 이어 붙인다
      propagate-context: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:15432/${TICKETING_PAYMENT_POSTGRES_DB:payment_db}
    username: ${TICKETING_PAYMENT_POSTGRES_USER:payment}
    password: ${TICKETING_PAYMENT_POSTGRES_PASSWORD}
    hikari:
      # 계정과 payment 스키마의 이름이 같으므로 이벤트 발행 레지스트리의 public 스키마를 명시한다.
      schema: public
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:19092
    producer:
      # 본문은 JSON 바이트 배열이다(KafkaMessageConfig). DLT도 원본 바이트를 그대로 보존한다
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      # 컨슈머 그룹이 처음 붙기 전에 발행된 이벤트도 받는다
      auto-offset-reset: earliest
    listener:
      # 토픽 파티션 수와 같게 둔다(측정 후 조정)
      concurrency: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
      table-prefix: batch.BATCH_
  modulith:
    events:
      # 재시작 시 완료되지 않은 이벤트 발행을 다시 처리한다. 리스너는 멱등해야 한다
      republish-outstanding-events-on-restart: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
  # starter-opentelemetry가 끌어오는 OTLP 지표 푸시는 쓰지 않는다 (지표는 Prometheus가 수집)
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      # Tempo 없이 개발할 때 내보내기 실패 로그가 쌓이지 않도록 기본은 끈다
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:14318/v1/traces}

server:
  port: 18085

ticketing:
  kafka:
    topic-prefix: ticketing
  startup-warmup:
    enabled: ${STARTUP_WARMUP_ENABLED:false}
    max-duration: ${STARTUP_WARMUP_MAX_DURATION:30s}
    adapter-iterations: ${STARTUP_WARMUP_ADAPTER_ITERATIONS:200}
  jwt:
    secret: ${TICKETING_JWT_SECRET}
  payment:
    fake-pg:
      base-url: http://localhost:18090
      connect-timeout: 3s
      read-timeout: 3s
      webhook-secret: ${FAKE_PG_WEBHOOK_SECRET}
      webhook-timestamp-tolerance: 5m
logging:
  level:
    org.jooq.Constants: off
