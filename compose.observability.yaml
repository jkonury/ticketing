# 부하 테스트용 관측 스택. 기존 인프라와 함께 띄운다:
#   docker compose -f compose.yaml -f compose.observability.yaml up -d
# 앱은 호스트에서 실행되므로 Prometheus가 host.docker.internal로 수집한다.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.32.0
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        config_file=$$(sh /etc/alertmanager/render-config.sh)
        exec /bin/alertmanager --config.file="$$config_file" --storage.path=/alertmanager --cluster.listen-address=
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:19093:9093"
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:13200:3200"
      - "127.0.0.1:14318:4318"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_HTTP_PORT: "3001"
    ports:
      - "127.0.0.1:13001:3001"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  loadtest-exporter:
    image: python:3.13.18-alpine3.23
    command: ["python3", "-B", "/app/dashboard-metrics.py", "serve", "/runs"]
    volumes:
      - ./scripts/loadtest/dashboard-metrics.py:/app/dashboard-metrics.py:ro
      - ./build/loadtest/runs:/runs:ro
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:19100/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-exporter:
    image: oliver006/redis_exporter:v1.77.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.18.1
    environment:
      DATA_SOURCE_NAME: postgresql://${TICKETING_POSTGRES_USER}:${TICKETING_POSTGRES_PASSWORD}@postgres:5432/${TICKETING_POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  alertmanager-data:
  prometheus-data:
  tempo-data:
  grafana-data:
