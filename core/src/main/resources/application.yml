spring:
  application:
    name: core
  config:
    # 로컬 비밀 값은 저장소 루트의 .env에서 읽는다 (bootRun은 core/가 작업 디렉터리, jar는 루트에서 실행)
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  task:
    execution:
      # @ApplicationModuleListener(비동기)로 넘어간 처리도 같은 trace에 이어 붙인다
      propagate-context: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:ticketing}
    username: ${POSTGRES_USER:ticketing}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
      table-prefix: batch.BATCH_
  modulith:
    events:
      # 재시작 시 완료되지 않은 이벤트 발행을 다시 처리한다. 리스너는 멱등해야 한다
      republish-outstanding-events-on-restart: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
  # starter-opentelemetry가 끌어오는 OTLP 지표 푸시는 쓰지 않는다 (지표는 Prometheus가 수집)
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      # Tempo 없이 개발할 때 내보내기 실패 로그가 쌓이지 않도록 기본은 끈다
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

server:
  port: 8080

ticketing:
  jwt:
    secret: ${JWT_SECRET}
  payment:
    fake-pg:
      webhook-secret: ${FAKE_PG_WEBHOOK_SECRET}
