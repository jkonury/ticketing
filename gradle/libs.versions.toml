# 의존성 버전은 여기에만 적는다. Spring Boot BOM이 관리하는 라이브러리(jOOQ, Flyway, Testcontainers 등)는
# 버전을 적지 않고 BOM에 맡긴다.
[versions]
java = "25"
kotlin = "2.3.21"
spring-boot = "4.1.2"
spring-dependency-management = "1.1.7"
spring-modulith = "2.1.1"
spring-cloud = "2025.1.4"
springdoc = "3.2.1"
archunit = "1.5.1"
ktlint = "1.8.0"
ktlint-gradle = "14.2.0"
# Kotlin 2.3.21·JDK 25 지원. 1.23.8은 Kotlin 2.0.21·JDK 21 기준이다.
detekt = "2.0.0-alpha.3"
# 부하 테스트(loadtest/gatling). Gradle 플러그인 버전이 곧 Gatling 버전이다.
gatling = "3.16.0"

[libraries]
# convention plugin이 쓰는 Gradle 플러그인 아티팩트
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlin-noarg = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }

# BOM. 버전은 위 [versions]에서만 관리한다.
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
springdoc-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
springdoc-webflux-api = { module = "org.springdoc:springdoc-openapi-starter-webflux-api", version.ref = "springdoc" }

archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

gradle-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
gradle-detekt = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }

[plugins]
gatling = { id = "io.gatling.gradle", version.ref = "gatling" }
