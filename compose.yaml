# 먼저 `./gradlew :fake-pg:bootJar` 필요 (fake-pg 이미지는 빌드된 jar를 복사한다)
# 로컬 개발용 인프라. 접속 정보는 .env에서 읽는다 (.env.example 참고).
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  fake-pg:
    build:
      context: ./fake-pg
    environment:
      FAKE_PG_WEBHOOK_SECRET: ${FAKE_PG_WEBHOOK_SECRET}
      FAKE_PG_WEBHOOK_URL: ${FAKE_PG_WEBHOOK_URL:-http://host.docker.internal:8080/api/v1/payments/webhooks/fake-pg}
    ports:
      - "127.0.0.1:8090:8090"
    # 코어는 호스트에서 bootRun으로 뜨므로 컨테이너가 호스트로 웹훅을 보낼 수 있어야 한다 (Linux 포함)
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
