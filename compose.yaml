# 먼저 `./gradlew :fake-pg:bootJar` 필요 (fake-pg 이미지는 빌드된 jar를 복사한다)
# 로컬 개발용 인프라. 접속 정보는 .env에서 읽는다 (.env.example 참고).
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      TICKETING_POSTGRES_DB: ${TICKETING_POSTGRES_DB}
      TICKETING_POSTGRES_USER: ${TICKETING_POSTGRES_USER}
      TICKETING_POSTGRES_PASSWORD: ${TICKETING_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${TICKETING_POSTGRES_USER} -d $${TICKETING_POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  fake-pg:
    build:
      context: ./fake-pg
    environment:
      FAKE_PG_WEBHOOK_SECRET: ${FAKE_PG_WEBHOOK_SECRET}
      FAKE_PG_WEBHOOK_URL: ${FAKE_PG_WEBHOOK_URL:-http://host.docker.internal:18080/api/v1/payments/webhooks/fake-pg}
    ports:
      - "127.0.0.1:18090:18090"
    # 코어는 호스트에서 bootRun으로 뜨므로 컨테이너가 호스트로 웹훅을 보낼 수 있어야 한다 (Linux 포함)
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:

# 네트워크를 재생성하면 br-<id>와 서브넷이 바뀌므로 방화벽 규칙은 바뀌지 않는 브릿지 이름에 건다.
# scripts/setup-firewall.sh가 이 이름 기준으로 UFW 규칙을 추가한다.
networks:
  default:
    driver_opts:
      com.docker.network.bridge.name: br-ticketing
