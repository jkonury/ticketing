# 로컬 개발용 인프라. fake-pg는 컨테이너가 아니라 스크립트(dev·e2e·loadtest)가 호스트에서 jar로 기동한다.
# 접속 정보는 .env에서 읽는다 (.env.example 참고).
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: ${TICKETING_POSTGRES_DB}
      POSTGRES_USER: ${TICKETING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TICKETING_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

# 네트워크를 재생성하면 br-<id>와 서브넷이 바뀌므로 방화벽 규칙은 바뀌지 않는 브릿지 이름에 건다.
# scripts/setup-firewall.sh가 이 이름 기준으로 UFW 규칙을 추가한다.
networks:
  default:
    driver_opts:
      com.docker.network.bridge.name: br-ticketing
