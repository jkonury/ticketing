# 로컬 개발용 인프라. fake-pg는 컨테이너가 아니라 스크립트(dev·e2e·loadtest)가 호스트에서 jar로 기동한다.
# 접속 정보는 .env에서 읽는다 (.env.example 참고).
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: ${TICKETING_POSTGRES_DB}
      POSTGRES_USER: ${TICKETING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TICKETING_POSTGRES_PASSWORD}
      TICKETING_PAYMENT_POSTGRES_DB: ${TICKETING_PAYMENT_POSTGRES_DB:-payment_db}
      TICKETING_PAYMENT_POSTGRES_USER: ${TICKETING_PAYMENT_POSTGRES_USER:-payment}
      TICKETING_PAYMENT_POSTGRES_PASSWORD: ${TICKETING_PAYMENT_POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 결제 계약 이벤트 외부화(M6, ADR 0043). KRaft 단일 브로커. 호스트에서는 localhost:19092로 접속한다.
  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:19092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12

volumes:
  postgres-data:
  kafka-data:

# 네트워크를 재생성하면 br-<id>와 서브넷이 바뀌므로 방화벽 규칙은 바뀌지 않는 브릿지 이름에 건다.
# scripts/setup-firewall.sh가 이 이름 기준으로 UFW 규칙을 추가한다.
networks:
  default:
    driver_opts:
      com.docker.network.bridge.name: br-ticketing
