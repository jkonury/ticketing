# Stop 검증 게이트(harness/hooks/stop_gate.py)의 이 저장소용 경로 규칙.
# 형식은 harness/lib/gate.py 머리말을 본다. 파일마다 위에서부터 처음 맞는 규칙 하나만 적용한다.
# task AC가 있으면 이 규칙 대신 AC를 실행한다. E2E는 게이트에서 돌리지 않는다(ADR 0048 결정 6).

[modules]
"common" = ":common"
"contract" = ":contract"
"core" = ":core"
"core-batch" = ":core-batch"
"payment" = ":payment"
"payment-batch" = ":payment-batch"
"settlement" = ":settlement"
"settlement-batch" = ":settlement-batch"
"realtime" = ":realtime"
"gateway" = ":gateway"
"fake-pg" = ":fake-pg"
"e2e" = ":e2e"
"loadtest/gatling" = ":loadtest-gatling"

[[rules]]
name = "markdown"
globs = ["*.md"]
commands = ["./scripts/agent/docs/check-docs.sh {files}"]

[[rules]]
name = "harness"
globs = ["harness/*"]
commands = ["python3 -m unittest discover -s harness/tests -q"]

[[rules]]
name = "loadtest-python"
globs = ["scripts/loadtest/*.py"]
commands = ["python3 -m unittest discover -s scripts/loadtest -p 'test_*.py' -q"]

# e2e·Gatling의 test 태스크는 실행 중인 환경이 필요하므로 정적 검사만 한다.
[[rules]]
name = "gradle-static-only"
per_module = true
globs = ["e2e/*", "loadtest/gatling/*"]
commands = ["./scripts/agent/test/check-summary.sh {module}:ktlintCheck {module}:detekt"]

[[rules]]
name = "gradle-module"
per_module = true
globs = ["*"]
commands = [
  "./scripts/agent/test/check-summary.sh {module}:ktlintCheck {module}:detekt",
  "./scripts/agent/test/run-tests.sh {module}:test",
]

[[rules]]
name = "gradle-build"
globs = ["build.gradle.kts", "settings.gradle.kts", "gradle.properties", "build-logic/*", "gradle/*"]
commands = ["./scripts/agent/test/check-summary.sh ktlintCheck detekt"]

[[rules]]
name = "web"
globs = ["web/*"]
commands = ["./scripts/agent/test/web-check.sh"]
