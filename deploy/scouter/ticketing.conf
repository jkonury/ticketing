###############################################################################
# Scouter Java agent 설정
#
# net_collector_*, obj_name 은 -D 값이 우선하므로 여기에 두지 않는다.
###############################################################################

### XLog 제외
# 헬스체크, Prometheus 수집, Spring 의 /error 내부 포워드는 XLog 와 TPS 에서 뺀다.
xlog_fully_discard_service_patterns=/actuator/*,/favicon.ico,/error
# HikariPool 의 connection-adder 스레드는 요청이 아니다.
xlog_discard_service_patterns=com.zaxxer.hikari.pool.HikariPool$PoolEntryCreator
xlog_discard_service_show_error=false

# 0 = 클라이언트 IP 로 사용자를 식별한다. 기본값(2)은 모든 응답에 SCOUTER Set-Cookie 를 붙인다.
trace_user_mode=0
# XLog 의 ipaddr 을 프록시가 넘긴 실제 클라이언트 IP 로 표시한다.
trace_http_client_ip_header_key=X-Real-IP

### 비동기 스레드 추적
# 지정한 패키지의 Runnable/Callable/lambda 만 훅하므로 애플리케이션 패키지로 한정한다.
hook_async_callrunnable_enabled=true
hook_spring_async_enabled=true
hook_async_thread_pool_executor_enabled=true

### 스케줄러·이벤트 리스너 XLog
# HTTP 요청 없이 실행되는 입장 스케줄러와 모듈 이벤트 리스너를 서비스 진입점으로 지정한다.
hook_service_patterns=io.github.ticketing.realtime.queue.AdmissionScheduler.*,io.github.ticketing.*Listener.*
hook_service_name_use_1st_string_enabled=false
_trace_auto_service_backstack_enabled=false

### 에러 표시
xlog_error_on_sqlexception_enabled=true
xlog_error_on_apicall_exception_enabled=true
xlog_error_sql_time_max_ms=10000
xlog_error_jdbc_fetch_max=10000
# 클라이언트 연결 끊김은 애플리케이션 에러가 아니다.
hook_exception_exclude_class_patterns=org.apache.catalina.connector.ClientAbortException,org.springframework.web.context.request.async.AsyncRequestNotUsableException
hook_exception_handler_exclude_class_patterns=org.apache.catalina.connector.ClientAbortException,org.springframework.web.context.request.async.AsyncRequestNotUsableException
profile_fullstack_service_error_enabled=true
profile_fullstack_apicall_error_enabled=true
profile_fullstack_sql_error_enabled=true
profile_fullstack_hooked_exception_enabled=true
profile_fullstack_max_lines=50

### 프로파일
# 토큰과 개인정보가 프로파일에 남지 않도록 요청 값과 컨트롤러 인자를 수집하지 않는다.
profile_http_querystring_enabled=true
profile_http_parameter_enabled=true
profile_http_header_enabled=true
profile_spring_controller_method_parameter_enabled=true
profile_thread_cputime_enabled=true
profile_thread_memory_usage_enabled=true

### 메서드 추적
profile_method_enabled=true
hook_method_lambda_enable=true
# 컨트롤러, 서비스, 이벤트 리스너, 스케줄러와 Gateway 필터를 추적한다.
hook_method_patterns=io.github.ticketing.*Controller.*,io.github.ticketing.*Service.*,io.github.ticketing.*Listener.*,io.github.ticketing.*Scheduler.*,io.github.ticketing.gateway.*Filter.*
# Kotlin 컴파일러가 만드는 합성 메서드(access$getX$p 접근자, $suspendImpl, $default)는 제외한다.
hook_method_exclude_patterns=*.access$*,*$suspendImpl,*$default,*$lambda$*
hook_method_ignore_prefixes=get,set,is,access$
hook_method_access_public_enabled=true
hook_method_access_protected_enabled=false
# private 보조 메서드(readBody, record, maskedRequestUri 등)는 호출 구간이 짧아 노이즈가 된다.
hook_method_access_private_enabled=false
hook_method_access_none_enabled=true

### 자동 덤프 / JMX
autodump_enabled=true
autodump_trigger_active_service_cnt=100
autodump_interval_ms=60000
jmx_counter_enabled=true
