###############################################################################
# Scouter Java agent 설정 (Gateway 전용)
#
# SSE 중계 부하에서 JVM 지표를 중심으로 관측한다.
# Reactor 훅을 켜 WebFlux HTTP XLog를 수집하되, SSE 스트림 경로는 수집에서 제외한다.
# realtime은 ticketing-realtime.conf, 코어는 ticketing.conf를 사용한다.
#
# net_collector_*, obj_name 은 -D 값이 우선하므로 여기에 두지 않는다.
###############################################################################

### XLog 제외
# 헬스체크, Prometheus 수집, Spring 의 /error 내부 포워드는 XLog 와 TPS 에서 뺀다.
# SSE 스트림(/api/v1/streams/*)은 요청 시작 시점에 트랜잭션을 만들지 않는다. 연결 수명 동안의 추적 비용이 없고
# XLog·TPS 에도 잡히지 않는다.
xlog_fully_discard_service_patterns=/actuator/*,/favicon.ico,/error,/api/v1/streams/*
# HikariPool 의 connection-adder 스레드는 요청이 아니다.
xlog_discard_service_patterns=com.zaxxer.hikari.pool.HikariPool$PoolEntryCreator
xlog_discard_service_show_error=false

# 0 = 클라이언트 IP 로 사용자를 식별한다. 기본값(2)은 모든 응답에 SCOUTER Set-Cookie 를 붙인다.
trace_user_mode=0
# XLog 의 ipaddr 을 프록시가 넘긴 실제 클라이언트 IP 로 표시한다.
trace_http_client_ip_header_key=X-Real-IP

### 비동기 스레드 추적
# SSE·코루틴 재개에 따른 비동기 추적 스텝과 Executor 훅 비용을 줄인다.
hook_async_callrunnable_enabled=false
hook_spring_async_enabled=false
hook_async_thread_pool_executor_enabled=false

### Redis 훅
# 입장 토큰·SSE 티켓·rate limit 검증의 Redis 명령 추적 비용을 줄인다.
_hook_redis_enabled=false

### Reactor·코루틴 훅
# reactive 훅은 WebFlux HTTP XLog 진입점이라 켠다. coroutine 훅은 끈다(mono{} 래핑 제거).
# txid 스레드 전파는 패치 에이전트(deploy/scouter/patches)의 context_propagation 모드를 쓴다. 기본 lift 모드의
# Hooks.onEachOperator 래핑은 자동 컨텍스트 전파(spring.reactor.context-propagation=auto)와 겹치면 모든 연산자에서
# ThreadLocal 복원을 일으켜 queue-surge CPU가 훅 OFF 대비 +55%였고, 이 모드에서는 OFF와 같았다
# (docs/performance/scouter-gatling-comparison.md, ADR 0027). 이 모드는 앱의 자동 컨텍스트 전파가 켜져 있어야 하고,
# Reactor 체크포인트 프로파일·scannable 덤프를 지원하지 않는다. 공식 에이전트는 이 키를 무시하고 lift로 동작한다.
_hook_reactive_enabled=true
_hook_coroutine_enabled=false
_hook_reactive_txid_propagation=context_propagation

### 에러 표시
xlog_error_on_sqlexception_enabled=true
xlog_error_on_apicall_exception_enabled=true
xlog_error_sql_time_max_ms=10000
xlog_error_jdbc_fetch_max=10000
# 클라이언트 연결 끊김은 애플리케이션 에러가 아니다.
hook_exception_exclude_class_patterns=org.apache.catalina.connector.ClientAbortException,org.springframework.web.context.request.async.AsyncRequestNotUsableException,reactor.netty.http.client.PrematureCloseException
hook_exception_handler_exclude_class_patterns=org.apache.catalina.connector.ClientAbortException,org.springframework.web.context.request.async.AsyncRequestNotUsableException,reactor.netty.http.client.PrematureCloseException
profile_fullstack_service_error_enabled=true
profile_fullstack_apicall_error_enabled=true
profile_fullstack_sql_error_enabled=true
profile_fullstack_hooked_exception_enabled=true
profile_fullstack_max_lines=50

### 프로파일
# 토큰과 개인정보가 프로파일에 남지 않도록 요청 값과 컨트롤러 인자를 수집하지 않는다.
profile_http_querystring_enabled=false
profile_http_parameter_enabled=false
# Spring Framework 7 의 HttpHeaders 는 Map 이 아니어서 Scouter 2.21.3 의 WebFlux 트레이서(Gateway)가
# HttpHeaders.entrySet() 호출에서 NoSuchMethodError 를 내고 XLog 가 누락된다. 켜지 않는다.
profile_http_header_enabled=false
profile_spring_controller_method_parameter_enabled=false
# 스레드별 CPU·할당량 수집 비용을 줄인다. 스레드를 이동하는 요청의 전체 비용으로 해석하기도 어렵다.
profile_thread_cputime_enabled=false
profile_thread_memory_usage_enabled=false

### 메서드 추적
profile_method_enabled=true
hook_method_lambda_enable=false
# 필터 메서드의 동기 구간만 추적 대상이다. Mono 완료까지의 시간은 측정하지 않는다.
hook_method_patterns=io.github.ticketing.gateway.*Filter.filter
# 구독·완료·오류·취소 시 조건부로 생성하는 Reactor 체크포인트를 수집하지 않는다.
profile_reactor_more_checkpoint_enabled=false
profile_reactor_checkpoint_enabled=false
# 전송 묶음 크기이며 전체 스텝 수의 상한은 아니다.
profile_step_max_count=256
# 연결별 프로파일 버퍼 크기. 차면 전송 후 교체하며 전체 메모리 상한을 보장하지는 않는다.
profile_step_max_keep_in_memory_count=256
# Kotlin 컴파일러가 만드는 합성 메서드(access$getX$p 접근자, $suspendImpl, $default)는 제외한다.
hook_method_exclude_patterns=*.access$*,*$suspendImpl,*$default,*$lambda$*
hook_method_ignore_prefixes=get,set,is,access$
hook_method_access_public_enabled=true
hook_method_access_protected_enabled=false
# private 보조 메서드(readBody, record, maskedRequestUri 등)는 호출 구간이 짧아 노이즈가 된다.
hook_method_access_private_enabled=false
hook_method_access_none_enabled=true

### 자동 덤프 / JMX
autodump_enabled=true
autodump_trigger_active_service_cnt=100
autodump_interval_ms=60000
jmx_counter_enabled=true
