name: 작업
description: 기능, 개선, 리팩터링, 문서, 측정 작업
labels: [enhancement]
body:
  - type: dropdown
    id: type
    attributes:
      label: 종류
      options: [feat, refactor, test, docs, chore]
    validations:
      required: true
  - type: dropdown
    id: modules
    attributes:
      label: 대상 모듈
      multiple: true
      options: [core, core-batch, payment, payment-batch, realtime, gateway, fake-pg, common, contract, web, loadtest, docs, agent]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 해결하려는 문제와 이유
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: 로드맵·ADR
      description: docs/roadmap.md 항목이나 ADR 번호. 로드맵 밖 작업이면 "단계와 무관"
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 가능하면 실행 가능한 명령으로 적는다
      placeholder: |
        - ./scripts/agent/test/verify-changed.sh main 통과
        - ./scripts/agent/test/run-tests.sh :core:test --tests "*BookingConcurrencyTest" 통과
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 범위 밖
      description: 이번 작업에서 하지 않는 것
