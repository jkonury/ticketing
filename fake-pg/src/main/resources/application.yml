spring:
  application:
    name: fake-pg
  threads:
    virtual:
      enabled: true

server:
  port: 8090

fake-pg:
  webhook:
    url: ${FAKE_PG_WEBHOOK_URL:http://localhost:8080/api/v1/payments/webhooks/fake-pg}
    # 기본값을 두지 않는다. 환경 변수로 반드시 주입한다
    secret: ${FAKE_PG_WEBHOOK_SECRET}
    delay: 500ms
    duplicate-count: 2
    max-attempts: 3
    retry-delay: 1s
  behavior:
    failure-rate: 0.0
    timeout-rate: 0.0
    duplicate-rate: 0.0
    timeout-delay: 10s
    delayed-webhook-delay: 6m
