spring:
  application:
    name: fake-pg
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # starter-opentelemetry가 끌어오는 OTLP 지표 푸시는 쓰지 않는다 (지표는 Prometheus가 수집)
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      # Tempo 없이 개발할 때 내보내기 실패 로그가 쌓이지 않도록 기본은 끈다
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

server:
  port: 8090

fake-pg:
  webhook:
    url: ${FAKE_PG_WEBHOOK_URL:http://localhost:8080/api/v1/payments/webhooks/fake-pg}
    # 기본값을 두지 않는다. 환경 변수로 반드시 주입한다
    secret: ${FAKE_PG_WEBHOOK_SECRET}
    delay: 500ms
    duplicate-count: 2
    max-attempts: 3
    retry-delay: 1s
  behavior:
    failure-rate: 0.0
    timeout-rate: 0.0
    duplicate-rate: 0.0
    timeout-delay: 10s
    delayed-webhook-delay: 6m
